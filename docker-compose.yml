version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super_secret_pass
      POSTGRES_DB: ads_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8000:80"
    depends_on:
      - db
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=super_secret_pass
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=ads_db

volumes:
  postgres_data: