services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super_secret_pass
      POSTGRES_DB: ads_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ИСПРАВЛЕНО: Добавлен healthcheck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:80"
    # ИСПРАВЛЕНО: Приложение ждет, пока база станет "здоровой"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=super_secret_pass
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=ads_db

volumes:
  postgres_data: